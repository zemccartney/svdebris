packages:
    - packages/*

blockExoticSubdeps: true

catalog:
    "@types/node": ^24.11.0
    astro: ^7.0.0
    tsdown: ^0.22.3
    typescript: ^6.0.0

disallowWorkspaceCycles: true

failIfNoMatch: true

ignoreWorkspaceRootCheck: true

minimumReleaseAge: 10080

allowBuilds:
    esbuild: false
    sharp: false
    workerd: false

trustPolicy: no-downgrade

trustPolicyExclude:
    - vite@6.4.1
    - chokidar@4.0.3
